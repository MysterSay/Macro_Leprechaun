<!doctype html><meta charset="utf-8"><style>body{font:14px Segoe UI,sans-serif;background:#181d21;color:#eee;padding:18px}label{display:block;margin:12px 0}input,textarea,select{font:inherit;background:#0f1215;color:#eee;border:1px solid #3c4842;border-radius:8px;padding:9px;box-sizing:border-box}input:not([type=checkbox]),textarea,select{display:block;width:100%}button{background:#6dde91;border:0;padding:10px 18px;border-radius:8px;margin-top:15px;cursor:pointer}textarea{height:130px}</style><style>:root{--accent:#6dde91}input[type=checkbox]{appearance:none;width:42px;height:24px;border-radius:30px;padding:0;position:relative;vertical-align:middle;cursor:pointer}input[type=checkbox]:before{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;background:#aaa;border-radius:50%;transition:transform .18s}input:checked{background:var(--accent)}input:checked:before{transform:translateX(18px);background:#102017}button{background:var(--accent)}</style><h2>Статистика ПК</h2><p>Оберіть доступні змінні. GPU потребує лічильників драйвера Windows; якщо вони недоступні, значення буде unavailable.</p><label><input type="checkbox" id="cpu"> CPU %</label><label><input type="checkbox" id="ram"> RAM %</label><label><input type="checkbox" id="gpu"> GPU %</label><label><input type="checkbox" id="keyboard"> Мова клавіатури</label><button id="save">Зберегти</button><script>const keys=["cpu","ram","gpu","keyboard"];addEventListener("message",e=>{if(e.data.type==="init")document.documentElement.style.setProperty("--accent",e.data.accent||"#6dde91");if(e.data.type==="init")for(const k of keys)document.getElementById(k).checked=!!e.data.value[k]});document.getElementById("save").onclick=()=>parent.postMessage({type:"save",value:Object.fromEntries(keys.map(k=>[k,document.getElementById(k).checked]))},"*")</script>
