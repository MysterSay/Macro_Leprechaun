<!doctype html><meta charset="utf-8"><style>body{font:14px Segoe UI,sans-serif;background:#181d21;color:#eee;padding:18px}label{display:block;margin:12px 0}input,textarea,select{font:inherit;background:#0f1215;color:#eee;border:1px solid #3c4842;border-radius:8px;padding:9px;box-sizing:border-box}input:not([type=checkbox]),textarea,select{display:block;width:100%}button{background:#6dde91;border:0;padding:10px 18px;border-radius:8px;margin-top:15px;cursor:pointer}textarea{height:130px}</style><label>Заголовок<input id="title"></label><label>Текст<textarea id="text"></textarea></label><button id="save">Зберегти</button><script>const keys=["title", "text"];addEventListener("message",e=>{if(e.data.type==="init")for(const k of keys)if(e.data.value[k]!==undefined)document.getElementById(k).value=e.data.value[k]});document.getElementById("save").onclick=()=>parent.postMessage({type:"save",value:Object.fromEntries(keys.map(k=>[k,document.getElementById(k).value]))},"*")</script>
