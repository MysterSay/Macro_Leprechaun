<!doctype html><meta charset="utf-8"><style>body{font:14px Segoe UI,sans-serif;background:#181d21;color:#eee;padding:18px}label{display:block;margin:12px 0}input,textarea,select{font:inherit;background:#0f1215;color:#eee;border:1px solid #3c4842;border-radius:8px;padding:9px;box-sizing:border-box}input:not([type=checkbox]),textarea,select{display:block;width:100%}button{background:#6dde91;border:0;padding:10px 18px;border-radius:8px;margin-top:15px;cursor:pointer}textarea{height:130px}</style><h2>Сповіщення</h2><p>Додайте пазл з категорії «Сповіщення» і налаштуйте заголовок та текст. Кастомне вікно має кольори, положення й таймер. Системне сповіщення використовує Windows NotifyIcon; його показ залежить від системних налаштувань сповіщень.</p>
